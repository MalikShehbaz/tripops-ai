
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tripops_ai_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: tripops_ai
      POSTGRES_USER: tripops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "5434:5432"

    volumes:
      - tripops_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripops -d tripops_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  tripops_postgres_data:
